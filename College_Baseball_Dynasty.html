<div class="card"><h2>📣 Program Pulse</h2><div class="bar"><div class="fill" style="width:${state.fan}%"></div></div><p class="muted">Fan confidence moves with wins, recruiting, stars, rivalries and postseason success.</p></div>
<div class="card"><h2>📰 Around the Program</h2>${state.news.slice(-5).reverse().map(x=>`<div class="news">${esc(x)}</div>`).join('')}</div>
<div class="grid"><div class="card"><h3>⚾ Next Game</h3><b>${nextOpponent()}</b><p class="muted">Week ${state.week} • Home</p><button class="primary" onclick="startGame()">Manage Game</button></div><div class="card"><h3>🔎 Recruiting</h3><b>${state.points} recruiting points</b><p class="muted">${state.recruits.filter(r=>r.interest>60).length} recruits are hot on your program.</p><button onclick="go('recruit')">Open Board</button></div></div>`}
function nextOpponent(){return TEAMS[(TEAMS.findIndex(x=>x.name===state.school.name)+state.week*7+13)%TEAMS.length].name}
function roster(){document.getElementById('main').innerHTML=`<div class="card"><div class="row"><div><h2>👥 Roster</h2><span class="muted">Morale, eligibility, injuries, development & draft stock</span></div><button onclick="develop()">Practice + Development</button></div><table class="table"><tr><th>Player</th><th>Pos</th><th>Year</th><th>OVR</th><th>Morale</th><th>GPA</th><th>Status</th></tr>${state.players.map((p,i)=>`<tr><td><b>${p.name}</b><br><span class="muted">POT ${p.pot}</span></td><td>${p.pos}</td><td>${p.year}</td><td><b>${p.ov}</b></td><td>${p.morale}</td><td class="${p.gpa<2.0?'bad':''}">${p.gpa}</td><td>${p.injury?`🩼 ${p.injury}w`:!p.elig?'📚 Ineligible':p.draft>0?`📋 ${p.draft}rd`: 'Healthy'}</td></tr>`).join('')}</table></div>`}
function develop(){state.players.forEach(p=>{let gain=Math.random()<.72?1:0;if(Math.random()<.12)gain++;p.ov=Math.min(p.pot,p.ov+gain);p.morale=Math.max(20,Math.min(100,p.morale+(Math.random()<.55?2:-1)));if(p.injury)p.injury--;if(p.gpa<2.0&&Math.random()<.35)p.elig=true});state.news.push('🏋️ Practice report: players worked on development and recovery.');state.points=Math.max(0,state.points-8);saveIt();render();alert('Practice complete. Your players can improve during the season!')}
function recruit(){document.getElementById('main').innerHTML=`<div class="card"><div class="row"><div><h2>🔎 Recruiting Board</h2><span class="muted">Use points to scout, call, visit and offer.</span></div><b>🎯 ${state.points} pts</b></div>${state.recruits.map((r,i)=>`<div class="choice"><div class="row"><div><b>${r.name}</b> <span class="pill">${r.pos}</span><br>OVR ${r.ov} • POT ${r.pot} • Interest ${r.interest}%<br><span class="muted">${r.schools} competing schools</span></div><div>${r.offered?'<span class="good">OFFERED</span>':`<button onclick="actRec(${i},'scout')">Scout 8</button> <button onclick="actRec(${i},'call')">Call 10</button> <button onclick="actRec(${i},'visit')">Visit 18</button> <button class="primary" onclick="actRec(${i},'offer')">Offer 15</button>`}</div></div></div>`).join('')}</div>`}
function actRec(i,a){let r=state.recruits[i],cost={scout:8,call:10,visit:18,offer:15}[a];if(state.points<cost)return alert('Not enough recruiting points.');state.points-=cost;r.interest=Math.min(100,r.interest+({scout:8,call:14,visit:24,offer:18}[a]));if(a==='offer'){r.offered=true;if(r.interest>72){state.players.push({name:r.name,pos:r.pos,year:'FR',ov:r.ov,pot:r.pot,morale:86,gpa:'3.2',injury:0,elig:true,bat:70,pit:70,draft:0});state.news.push(`🎉 ${r.name} committed to ${state.school.name}!`)}else state.news.push(`📞 ${r.name} is considering your offer.`)}saveIt();render()}
function schedule(){let games=Array.from({length:12},(_,i)=>({week:i+1,opp:TEAMS[(TEAMS.findIndex(x=>x.name===state.school.name)+i*11+17)%TEAMS.length].name,home:i%2===0,status:i<state.week?'FINAL':'UPCOMING'}));document.getElementById('main').innerHTML=`<div class="card"><h2>📅 Season Schedule</h2>${games.map(g=>`<div class="row" style="padding:11px 0;border-bottom:1px solid #223d4f"><div><b>Week ${g.week}</b> • ${g.home?'vs':'@'} ${g.opp}</div><span class="pill">${g.status}</span></div>`).join('')}<p class="muted">Conference tournament and NCAA postseason unlock after the regular season.</p></div>`}
function social(){document.getElementById('main').innerHTML=`<div class="card"><h2>📱 Social Feed</h2><div class="news">🔥 Fanbase: ${state.fan}/100 — ${state.fan>70?'The stadium is rocking.':'Fans want to see results.'}</div>${state.news.slice(-12).reverse().map((n,i)=>`<div class="feed"><div class="avatar">${['⚾','🔥','🎓','🧢'][i%4]}</div><div><b>${['BaseballDad92','DugoutQueen','Alum4Life','DiamondTalk'][i%4]}</b><br>${esc(n)}<br><span class="muted">${i+1}h • ❤️ ${3+i*7}</span></div></div>`).join('')}</div>`}
function startGame(){state.game={inning:1,half:'Top',outs:0,home:0,away:0,ab:0,h:0,e:0,log:['Play ball!'],over:false};go('game')}
function gameScreen(){if(!state.game){startGame();return}let g=state.game;document.getElementById('main').innerHTML=`<div class="card"><div class="score"><div class="row"><b>${esc(nextOpponent())}</b><b>${g.away}</b></div><div class="row"><b>${esc(state.school.name)}</b><b>${g.home}</b></div><div class="muted">${g.half} ${g.inning} • ${g.outs} outs • Speed ${g.speed||'Normal'}</div></div><div class="field"><div class="diamond"><div class="base b1"></div><div class="base b2"></div><div class="base b3"></div><div class="base home"></div></div><div class="mound"></div></div><div class="grid" style="margin-top:12px"><button onclick="play('pitch')">▶ Pitch</button><button onclick="play('hit')">💥 Swing</button><button onclick="play('steal')">🏃 Aggressive</button><button onclick="play('change')">🧠 Coaching Move</button></div><div style="margin-top:12px"><button onclick="setSpeed(0.5)">🐢 Slow</button> <button onclick="setSpeed(1)">⚡ Medium</button> <button onclick="setSpeed(2)">🚀 Fast</button></div></div>
<div class="card"><h3>📊 Live Box Score</h3><table class="table"><tr><th>Team</th><th>R</th><th>H</th><th>E</th><th>Inning</th></tr><tr><td>${esc(nextOpponent())}</td><td>${g.away}</td><td>${g.hitsAway||0}</td><td>${g.eAway||0}</td><td>${g.inning}</td></tr><tr><td>${esc(state.school.name)}</td><td>${g.home}</td><td>${g.hitsHome||0}</td><td>${g.eHome||0}</td><td>${g.inning}</td></tr></table></div>
<div class="card"><h3>📣 Play-by-Play</h3>${g.log.slice(-8).reverse().map(x=>`<div class="news">${esc(x)}</div>`).join('')}</div>`}
function setSpeed(s){state.speed=s; if(state.game)state.game.speed=s===.5?'Slow':s===1?'Medium':'Fast';saveIt();render()}
function play(type){let g=state.game;if(g.over)return;let batting=g.half==='Top';let roll=Math.random();let action='';
if(type==='change'){action=roll<.55?'Pitching change settles things.':'The batter adjusts and lines one into the gap.'}
else if(type==='steal'){action=roll<.5?'Stolen base!':'Picked off!'; if(roll<.5){if(batting)g.away++;else g.home++}}
else if(type==='hit'){if(roll<.22){batting?g.away++:g.home++;batting?g.hitsAway++:g.hitsHome++;action='💥 HOME RUN! The dugout erupts!'}else if(roll<.58){batting?g.hitsAway++:g.hitsHome++;action='Base hit up the middle.'}else{g.outs++;action='Swing and a miss.'}}
else{if(roll<.33){action='Called strike.'}else if(roll<.7){g.outs++;action='Ground ball — OUT at first.'}else{action='Ball four. Runner aboard.'}}
g.log.push(action);if(g.outs>=3){g.outs=0;if(g.half==='Top')g.half='Bottom';else{g.half='Top';g.inning++}}
if(g.inning>7){g.over=true;finishGame()}saveIt();render()}
function finishGame(){let g=state.game;let w=g.home>g.away;state.record[w?0:1]++;state.fan=Math.max(0,Math.min(100,state.fan+(w?4:-5)));state.security=Math.max(0,Math.min(100,state.security+(w?3:-5)));state.money+=w?12000:3000;state.news.push(`${w?'🎉 WIN!':'😬 LOSS.'} Final: ${state.school.name} ${g.home}, ${nextOpponent()} ${g.away}. Fans ${w?'love':'question'} the direction of the program.`);state.week++;state.players.forEach(p=>{if(Math.random()<.07){p.injury=1+Math.floor(Math.random()*5);state.news.push(`🩼 ${p.name} suffered an injury and is expected out ${p.injury} weeks.`)}if(Math.random()<.035){p.gpa=(1.4+Math.random()*1.1).toFixed(1);p.elig=Number(p.gpa)>=2.0;if(!p.elig)state.news.push(`📚 ${p.name} is academically ineligible.`)}});if(state.security<=15){state.fired=true;state.news.push('🚨 THE ATHLETIC DEPARTMENT HAS FIRED YOU.');}state.game=null}
function renderFired(){document.getElementById('app').innerHTML=`<div class="hero"><h1>🚨 You're Fired</h1><p>You were dismissed by the athletic department after your job security collapsed.</p><div class="grid"><div class="stat">Career Record<b>${state.record[0]}-${state.record[1]}</b></div><div class="stat">Fans<b>${state.fan}/100</b></div><div class="stat">Money Earned<b>${money(state.money)}</b></div></div><button class="primary" onclick="newCareer()">Start a New Career</button></div>`}
function newCareer(){localStorage.removeItem('cbd_save');location.reload()}
function go(x){state.screen=x;saveIt();render()}
render();
</script></body></html>
